<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiqueta - EEMA</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        /* Botões de controle (somem na impressão) */
        .painel { margin-bottom: 30px; }
        .painel button { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin: 0 10px; }
        .btn-voltar { background-color: #ccc; color: #333; }
        .btn-imprimir { background-color: #0b3975; color: white; }
        
        /* A Etiqueta */
        .etiqueta-container {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            background-color: #fff;
            width: 650px;
            box-sizing: border-box;
        }
        .logo {
            width: 80px; height: 80px; margin-right: 30px;
            background-image: url('assets/logo.png'); /* Puxa sua logo da pasta */
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        .etiqueta-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .etiqueta-title { font-size: 18px; font-weight: 900; color: #0b3975; margin-bottom: 18px; text-transform: uppercase; }
        .etiqueta-info { font-size: 14px; color: #333; margin-bottom: 10px; text-align: center; }
        .etiqueta-info strong { font-weight: 800; color: #000; }
        .etiqueta-footer { font-size: 12px; color: #444; margin-top: 5px; text-align: center; }

        @media print {
            body { background-color: transparent; padding: 0; }
            .painel { display: none; }
            .etiqueta-container { border: 2px dashed #94a3b8; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="painel no-print">
        <a href="index.html"><button class="btn-voltar">⬅ Voltar ao Relatório</button></a>
        <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir Etiqueta</button>
    </div>

    <div class="etiqueta-container">
        <div class="logo"></div>
        <div class="etiqueta-content">
            <div class="etiqueta-title">ESCOLA ESTADUAL MESTRA AURORA</div>
            <div class="etiqueta-info"><strong>ESTUDANTE:</strong> CARLOS HENRIQUE MOTA LEITE</div>
            <div class="etiqueta-info"><strong>TURMA:</strong> 6º ANO DO ENSINO FUNDAMENTAL - 6º REG 2</div>
            <div class="etiqueta-info"><strong>CONTEÚDO:</strong> DOCUMENTOS PEDAGÓGICOS - 2026</div>
            <div class="etiqueta-footer">Carbonita - MG, 10 de novembro de 2026.</div>
        </div>
    </div>
</body>
</html>
