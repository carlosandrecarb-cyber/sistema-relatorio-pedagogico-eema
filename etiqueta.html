<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta - EEMA</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f4f9; display: flex; flex-direction: column;
            align-items: center; padding: 40px; margin: 0;
        }
        .painel { margin-bottom: 30px; }
        .painel button { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin: 0 10px; }
        .btn-voltar { background-color: #ccc; color: #333; text-decoration: none; }
        .btn-imprimir { background-color: #0b3975; color: white; }
        
        .etiqueta-container {
            border: 2px dashed #94a3b8; border-radius: 12px; padding: 25px 30px;
            display: flex; align-items: center; background-color: #fff;
            width: 650px; box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .logo { width: 80px; height: 80px; margin-right: 30px; object-fit: contain; }
        
        .etiqueta-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .etiqueta-title { font-size: 18px; font-weight: 900; color: #0b3975; margin-bottom: 18px; text-transform: uppercase; }
        .etiqueta-info { font-size: 14px; color: #333; margin-bottom: 10px; text-align: center; }
        .etiqueta-info strong { font-weight: 800; color: #000; }
        .etiqueta-footer { font-size: 12px; color: #444; margin-top: 5px; text-align: center; }

        @media print {
            body { background-color: transparent; padding: 0; }
            .painel { display: none; }
            .etiqueta-container { box-shadow: none; margin-top: 20px; }
        }
    </style>
</head>
<body>
    <div class="painel no-print">
        <a href="index.html" class="btn-voltar">⬅ Voltar ao Relatório</a>
        <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir Etiqueta</button>
    </div>

    <div class="etiqueta-container">
        <!-- AQUI: Chama diretamente o ficheiro de imagem -->
        <img src="logo.png" alt="Logo EEMA" class="logo">
        
        <div class="etiqueta-content">
            <div class="etiqueta-title">ESCOLA ESTADUAL MESTRA AURORA</div>
            <div class="etiqueta-info"><strong>ESTUDANTE:</strong> <span id="etiq-nome">CARLOS HENRIQUE MOTA LEITE</span></div>
            <div class="etiqueta-info"><strong>TURMA:</strong> <span id="etiq-turma">6º ANO DO ENSINO FUNDAMENTAL - 6º REG 2</span></div>
            <div class="etiqueta-info"><strong>CONTEÚDO:</strong> DOCUMENTOS PEDAGÓGICOS - 2026</div>
            <div class="etiqueta-footer" id="etiq-data">Carbonita - MG, 10 de novembro de 2026.</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let est = localStorage.getItem('estudanteAtual');
            let tur = localStorage.getItem('turmaAtual');
            if(est) document.getElementById('etiq-nome').textContent = est;
            if(tur) document.getElementById('etiq-turma').textContent = tur;
            
            const dataElement = document.getElementById('etiq-data');
            const hoje = new Date();
            const opcoes = { day: '2-digit', month: 'long', year: 'numeric' };
            dataElement.textContent = `Carbonita - MG, ${hoje.toLocaleDateString('pt-BR', opcoes)}.`;
        });
    </script>
</body>
</html>
